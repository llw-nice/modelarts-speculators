# D-MTP v1.5 dual-anchor fusion with position-weighted transcript-token CE.
# Paths are private and must be supplied by the operator.
dense_checkpoint: ${DFLASH2_INITIAL}
shared: ${DFLASH2_SHARED}
manifest: ${DMTP_CACHE_MANIFEST}
output: ${DMTP_RUN_ROOT}/fusion-v1.5-token-ce-3e-5
arm: fusion
fusion_init: residual-zero
objective: token_ce
lr: 3e-5
epochs: 5
warmup_fraction: 0.2
batch_sequences: 32
context_token_budget: 48000
anchors: 64
eval_batch_sequences: 4
eval_anchors: 8
seed: 280
memory_limit_gib: 96
cache_target_precision: fp8
